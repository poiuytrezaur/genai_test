<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Weather App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Weather App</h1>
            <nav>
                <a href="/">Home</a>
                <a href="/weather">Weather</a>
                <a href="/login">Login</a>
                <a href="/register">Register</a>
            </nav>
        </header>

        <main>
            <div class="form-container">
                <h2>Register</h2>
                <div id="message" class="message"></div>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" required minlength="3" maxlength="80">
                        <small>3-80 characters</small>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required minlength="6">
                        <small>Minimum 6 characters</small>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password:</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Register</button>
                </form>
                <p class="form-footer">Already have an account? <a href="/login">Login here</a></p>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 Weather App. All rights reserved.</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>
</html>
